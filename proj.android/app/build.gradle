apply plugin: 'com.android.application'

android {
    namespace 'com.infercore.hexcrunch'
    compileSdk PROP_COMPILE_SDK_VERSION.toInteger()

    // Pin the NDK version used successfully with this Cocos2d-x 4.0 project.
    ndkVersion '20.1.5948944'

    defaultConfig {
        applicationId 'com.infercore.hexcrunch'
        minSdk PROP_MIN_SDK_VERSION.toInteger()
        targetSdk PROP_TARGET_SDK_VERSION.toInteger()
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                targets 'MyGame'
                arguments '-DCMAKE_FIND_ROOT_PATH=',
                          '-DANDROID_STL=c++_static',
                          '-DANDROID_TOOLCHAIN=clang',
                          '-DANDROID_ARM_NEON=TRUE'
                cppFlags '-frtti -fexceptions -fsigned-char'
            }
        }

        ndk {
            abiFilters.clear()
            abiFilters.addAll(PROP_APP_ABI.split(':').collect { it as String })
        }
    }

    sourceSets {
        main {
            java.srcDir 'src'
            res.srcDir 'res'
            manifest.srcFile 'AndroidManifest.xml'
            assets.srcDir '../../Resources'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }

        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
}
