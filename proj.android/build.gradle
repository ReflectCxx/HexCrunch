// Top-level Gradle build for the Cocos2d-x Android project.
// Updated for modern Android Studio / AGP while keeping the Cocos2d-x 4.0 native project intact.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
